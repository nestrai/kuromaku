[package]
name = "kuromaku"
version = "2026.9.0"
edition = "2024"
description = "Reproducible AI agent teams with persistent shared state"
license = "MIT"
repository = "https://github.com/nestrai/kuromaku"

[[bin]]
name = "kuro"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
crossterm = "0.28"
color-eyre = "0.6"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tempfile = "3"
clap_complete = "4.6.2"
regex-lite = "0.1.9"
termimad = "0.34.1"
sha2 = "0.10"
ulid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
libc = "0.2"
# futures-util pulls in `FuturesUnordered`, used by the MCP server to
# dispatch JSON-RPC frames concurrently without requiring a `'static`
# bound on the writer (which would break the in-memory test setup).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
