[package]
name = "koto"
version = "0.1.0"
edition = "2024"
description = "Reproducible AI agent teams with persistent shared state"
license = "MIT"
repository = "https://github.com/charemma/koto"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
crossterm = "0.28"
color-eyre = "0.6"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
