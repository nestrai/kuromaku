version: "1"

# Seed cascade -- earlier entries win. All paths are repository-relative so
# a fresh clone resolves without any maintainer-local directories (#398).
# The richer private persona library can be layered back in locally via
# additional seed entries or `--role` overrides; the tracked cascade must
# stay self-contained.
seeds:
  - path: .kuro/
  - path: seeds/rust/
  - path: seeds/common/

tiers:
  reasoning: claude/fable-5
  general: claude/sonnet-4-6
  quick: claude/haiku-4-5

defaults:
  backend: cli

roles:
  developer:
    agent: Noah
  reviewer:
    agent: Bella
  architect:
    agent: Levi
  steering:
    agent: Babis
  facilitator:
    agent: Mika
  fetcher:
    agent: Minion
