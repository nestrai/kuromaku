version: "1"
name: validate-issues
prompt: |
  Scan all open issues in this repository and evaluate whether each
  issue is ready to be picked up by an AI agent team. Label issues
  that need attention, then maintain ONE standing triage discussion
  with the report.

  Labels used by this flow (created by the prepare state if missing):
  - needs-spec: issue lacks Summary, scope, or testable acceptance criteria
  - needs-split: issue is too large -- should become an epic with sub-issues

  Output channel: a single GitHub Discussion in the "Backlog" category.
  Updated on every run, not duplicated. The discussion accumulates
  comments per scan so the history stays visible.

initial: prepare

graph:
  prepare:
    role: developer
    task: |
      Ensure the labels this flow uses exist on the repository.
      Idempotent: safe to run multiple times.

      ```bash
      gh label list --json name --jq '.[].name'
      # only create missing ones:
      gh label create needs-spec --color fbca04 --description "Issue lacks Summary, scope, or testable acceptance criteria."
      gh label create needs-split --color d93f0b --description "Issue is too large -- should be split into sub-issues."
      ```

      Output: list of labels confirmed/created.
    next:
      - scan: "labels ready"
      - aborted: "label setup failed"

  scan:
    role: reviewer
    task: |
      Fetch all open issues:
      `gh issue list --state open --limit 200 --json number,title,body,labels`

      For each issue, evaluate against these criteria:

      1. **Summary section** -- is there a `## Summary` or `## TL;DR` (max 3 sentences) at the top?
      2. **Clear problem statement** -- is it obvious what needs to change and why?
      3. **Defined scope** -- is it clear what is in scope and what is not?
      4. **Acceptance criteria** -- are there testable checkbox conditions for "done"?
      5. **No ambiguity** -- can an agent implement this without guessing?
      6. **Right size** -- is it one unit of work, not an epic disguised as an issue?

      Classify each issue:

      ### Ready (agent can pick this up as-is)
      #N | title

      ### Needs specification (label as needs-spec)
      #N | title | what is missing (one line)

      ### Too large (should be split into sub-issues)
      #N | title | suggested split

      ### Already labelled (skip)
      #N | title | existing label: obsolete/parked/needs-decision

      Rules:
      - Epics are NOT issues -- skip anything with "epic" in the title
      - An issue with `## Summary` AND acceptance criteria checkboxes is likely ready
      - An issue that says "design X" or "discuss Y" without concrete output is needs-spec
      - Be strict. Agents waste time on vague issues.
    next:
      - label: "found issues that need attention"
      - done: "all issues are agent-ready"

  label:
    role: developer
    task: |
      Apply labels (no individual comments -- the triage discussion
      carries the full reasoning):

      ```bash
      gh issue edit <number> --add-label needs-spec
      gh issue edit <number> --add-label needs-split
      ```

      Do NOT touch "Ready" or "Already labelled" issues.

      List what you did:
      - #N: labelled needs-spec
      - #M: labelled needs-split
    next:
      - triage-discussion: "labels applied, ready to update discussion"
      - aborted: "labelling failed"

  triage-discussion:
    role: developer
    task: |
      Maintain ONE standing triage discussion in the "Backlog" category.
      Update its body if it exists, create it once if not. Comments are
      added on every run to track history.

      Steps:

      1. Get the repository ID and the Backlog category ID:

         ```bash
         REPO_ID=$(gh api graphql -f query='query { repository(owner: "<owner>", name: "<repo>") { id } }' --jq '.data.repository.id')
         CATEGORY_ID=$(gh api graphql -f query='query { repository(owner: "<owner>", name: "<repo>") { discussionCategories(first: 25) { nodes { id slug } } } }' --jq '.data.repository.discussionCategories.nodes[] | select(.slug == "backlog") | .id')
         ```

      2. Look for an existing discussion titled exactly "Backlog triage" in the Backlog category:

         ```bash
         gh api graphql -f query='query { repository(owner: "<owner>", name: "<repo>") { discussions(first: 50, categoryId: "<CATEGORY_ID>") { nodes { id title number } } } }'
         ```

      3a. **If exists**: edit its body and add a comment:

         ```bash
         gh api graphql -f query='mutation($id: ID!, $body: String!) { updateDiscussion(input: { discussionId: $id, body: $body }) { discussion { url } } }' -f id=<discussion-id> -F body=@/tmp/triage-body.md

         gh api graphql -f query='mutation($id: ID!, $body: String!) { addDiscussionComment(input: { discussionId: $id, body: $body }) { comment { url } } }' -f id=<discussion-id> -F body="Re-scanned <YYYY-MM-DD>: <X> needs-spec, <Y> needs-split, <Z> ready"
         ```

      3b. **If not exists**: create it in the Backlog category:

         ```bash
         gh api graphql -f query='mutation($repo: ID!, $cat: ID!, $title: String!, $body: String!) { createDiscussion(input: { repositoryId: $repo, categoryId: $cat, title: $title, body: $body }) { discussion { url } } }' -f repo=$REPO_ID -f cat=$CATEGORY_ID -f title="Backlog triage" -F body=@/tmp/triage-body.md
         ```

      Body structure (same in both cases, written to /tmp/triage-body.md first):

      ```markdown
      ## Summary

      Standing triage tracking discussion. Updated by `kuro run validate-issues`.
      Last scan: <YYYY-MM-DD>. Lists open issues that need attention before
      they can be picked up by an AI agent team.

      ## Needs specification (X)

      - [ ] #N -- title -- what is missing
      - [ ] #M -- title -- what is missing
      ...

      ## Needs split (Y)

      - [ ] #N -- title -- suggested split
      ...

      ## How to clear an item

      For each `needs-spec` issue: add a `## Summary` section, define
      scope, write testable acceptance criteria, then remove the label.

      For each `needs-split` issue: open sub-issues, link them, then
      close the original or convert it to an epic.

      Re-run `kuro run validate-issues` to update this list.
      ```

      Output the discussion URL (whether updated or created).
    next:
      - done: "triage discussion updated"
      - aborted: "could not update triage discussion"

  done:
    final: "validation complete -- see the Backlog triage discussion for the report"

  aborted:
    final: "validation aborted -- check the previous step output for the failure reason"
