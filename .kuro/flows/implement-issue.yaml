# Project-local override of the canonical implement-issue graph.
#
# Topology:
#   design (architect) --> implement (developer)
#   implement --> review (reviewer)
#   review   --> verify (shell: just lint && just test)
#   verify   --> pr (pass) or implement (fail, with captured output)
#   pr       --> done
#
# Usage: kuro run implement-issue --var id=42
version: "1"
name: implement-issue
prompt: |
  Implement issue #{{vars.id}} in this repository. Follow the team's rules
  and produce a draft PR at the end.

initial: design

graph:
  design:
    role: architect
    task: |
      Read issue #{{vars.id}} (`gh issue view {{vars.id}} --comments`). Produce a
      short design plan: affected files, interfaces, tests. Do not modify
      code.
    select:
      - implement: "plan complete, ready to build"
      - aborted: "missing context, cannot plan"

  implement:
    role: developer
    task: |
      Implement the design from the previous step. Conventional commits,
      feature branch, never main. Add or update tests.
    select:
      - review: "all design items implemented and committed"
      - design: "implementation revealed a design flaw, need to revisit"
      - aborted: "cannot proceed safely"

  review:
    role: reviewer
    task: |
      Review the implementation against the original issue's acceptance
      criteria. Run `gh issue view {{vars.id}}` if you need the original
      criteria -- do not rely solely on the implementer's restatement.

      Use your role's review format. End with exactly:

      ### Summary
      - Blocking issues: [list or "none"]
      - FINAL_VERDICT: PASS | FAIL

      The `FINAL_VERDICT:` line must appear exactly once on its own
      line. If the implementation solved the wrong problem, FAIL
      regardless of code quality. Pick `verify` only when the verdict
      is PASS.
    select:
      - verify: "all acceptance criteria met, code quality acceptable"
      - implement: "code-level changes needed (naming, refactor, missing test)"
      - design: "implementation revealed the design itself is wrong"
      - aborted: "review cannot complete"

  # Deterministic verify gate. No agent, no LLM call -- exit code from
  # `just lint && just test` decides routing. The captured output is
  # threaded into the implementer's next prompt via prior_context.
  verify:
    run: just lint && just test
    select:
      - pr: pass
      - implement: fail

  pr:
    role: developer
    task: |
      Push the branch and open a draft PR with `Closes #{{vars.id}}`.
      Output the PR URL on its own line so downstream tooling can
      extract it.
    select:
      - done: "PR opened"
      - aborted: "PR creation failed"

  done:
    final: "Happy-path exit -- implementation reviewed and PR opened."

  aborted:
    final: "Early exit because a step could not proceed safely."
