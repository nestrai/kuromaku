# Fix a GitHub issue: fetch -> implement -> review -> ship.
# Usage: koto up fix-issue issue=35
# Override roles: koto up fix-issue issue=35 implementer=Kai reviewer=Levi
version: "1"
name: fix-issue
prompt: |
  Fix issue #{{issue}} in this repository. Read the issue carefully,
  implement the fix, and create a PR.

roles:
  fetcher: { default: Minion }
  implementer: { default: Noah }
  reviewer: { default: Bella }

flow:
  fetch:
    role: fetcher
    task: |
      Fetch issue #{{issue}} using gh issue view --comments.
      Output the full issue description and comments as-is.
      Do not analyze or comment -- just output the raw data.

  implement:
    role: implementer
    input: [fetch]
    task: |
      Implement the fix described in the issue. Create a feature branch,
      make the changes, and write tests. Follow the project conventions.
      Commit with conventional commit messages.

  review:
    role: reviewer
    input: [fetch, implement]
    task: |
      Review the implementation against the issue requirements.
      Check: does it actually fix the issue? Are there edge cases?
      Are the tests sufficient? Any regressions?

  ship:
    role: implementer
    input: [review]
    print_output: true
    task: |
      If the review has no blocking issues, push the branch and create
      a PR that references the issue (Closes #{{issue}}).
      If the review found blocking issues, fix them first.
      Output the PR URL and a summary of what was done.
