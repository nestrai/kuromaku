# New feature development: design -> implement -> review -> ship.
# Usage: koto up development -t "Add content-addressable caching for step outputs"
version: "1"
name: development
prompt: |
  {{task}}

roles:
  architect:
    default: Levi
  developer:
    default: Noah
  reviewer:
    default: Bella

flow:
  design:
    role: architect
    task: |
      Design the implementation for this feature. Identify which modules
      need changes, propose the approach, and flag any architectural
      concerns. Output a concrete design doc, not a wishlist.

  implement:
    role: developer
    input: [design]
    task: |
      Implement the feature based on the design doc. Before coding,
      restate the original task in your own words and compare it to
      the design. If the design diverged from the original task, flag
      it with DIVERGENCE: and explain before proceeding.
      Create a feature branch, write the code and tests. Follow the
      project conventions. Commit with conventional commit messages.

  review:
    role: reviewer
    input: [design, implement]
    print_output: true
    task: |
      Review the implementation against the ORIGINAL task (shown at
      the top of this prompt), not just the design doc. Check: does
      the implementation actually deliver what was asked for? If the
      design diverged from the original task, flag it.
      Secondary: correctness, test coverage, project conventions.
      List only actual issues.
