# Fix review suggestions on a PR: fetch -> fix -> verify.
# Usage: koto up fix-pr pr=43
version: "1"
name: fix-pr
prompt: |
  Fix the review suggestions on PR #{{pr}}.

roles:
  fetcher:
    default: Minion
  developer:
    default: Noah
  reviewer:
    default: Bella

flow:
  fetch:
    role: fetcher
    task: |
      Fetch PR #{{pr}} with review comments.
      Run gh pr view, gh pr diff, and fetch all comments:
      gh api repos/{owner}/{repo}/pulls/{{pr}}/comments
      gh api repos/{owner}/{repo}/issues/{{pr}}/comments
      Output everything as-is. Do not analyze or comment.

  fix:
    role: developer
    input: [fetch]
    task: |
      Implement the review suggestions from the PR comments.
      Only fix what was flagged -- no scope creep, no bonus improvements.
      Commit each fix as a fixup commit targeting the original commit.

  verify:
    role: reviewer
    input: [fetch, fix]
    print_output: true
    task: |
      Verify the fixes address each review suggestion. Check nothing
      was missed and nothing extra was added. List status per suggestion:
      fixed, partially fixed, or not addressed.
      After verification, post a short summary as a PR comment using
      gh pr comment {{pr}} -- one line per suggestion with status.
