# Implement a GitHub issue: implement > review > pr.
# Usage: koto up implement-issue id=42
version: "1"
name: implement-issue
prompt: |
  Implement issue #{{id}} in this repository.

roles:
  developer: { default: Noah }
  reviewer: { default: Bella }

flow:
  implement:
    role: developer
    task: |
      Fetch and implement issue #{{id}}.

      ## Step 1: fetch the issue

      Run `gh issue view {{id}} --comments` and read the full issue
      description and acceptance criteria before doing anything else.

      ## Step 2: git workflow

      1. `git fetch origin && git checkout origin/main`
      2. `git checkout -b <type>/<short-slug>-{{id}}`
      3. Conventional Commits. Never commit to main.

      ## Step 3: implement

      Follow your role's workflow (Understanding, Concerns,
      Implementation, Tests, Verification). For each acceptance
      criterion, list ambiguities with chosen vs rejected
      interpretation before coding.

  review:
    role: reviewer
    input: [implement]
    task: |
      Review the implementation against the original issue's acceptance criteria.
      Run `gh issue view {{id}}` to get the original issue if needed -- do not
      rely only on the implementer's restatement.

      Use your role's review format. End with exactly:

      ### Summary
      - Blocking issues: [list or "none"]
      - FINAL_VERDICT: PASS | FAIL

      The `FINAL_VERDICT:` line must appear exactly once on its own
      line. If the implementation solved the wrong problem, FAIL
      regardless of code quality.

  pr:
    role: developer
    input: [review]
    print_output: true
    task: |
      Check the review for `FINAL_VERDICT: PASS` or
      `FINAL_VERDICT: FAIL`.

      If PASS: push the branch and create a draft PR
      (`Closes #{{id}}`). Output the PR URL.

      If FAIL: output the blocking issues. Do not create a PR.

      If neither token found: output "Review verdict unclear." Stop.
