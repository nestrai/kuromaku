# Apply PR review feedback as fixup commits: fetch -> fix -> verify -> push.
# Usage: koto up rework-pr id=119
version: "1"
name: rework-pr
prompt: |
  Apply the review feedback on PR #{{id}} as fixup commits in this repository.

roles:
  fetcher:
    default: Minion
  developer:
    default: Noah
  reviewer:
    default: Bella

flow:
  fetch:
    role: fetcher
    task: |
      Fetch everything needed to rework PR #{{id}}. Run, in order:

      - gh pr view {{id}}
      - gh pr view {{id}} --json headRefName,headRefOid,baseRefName
      - gh pr diff {{id}}
      - gh api repos/{owner}/{repo}/pulls/{{id}}/comments

      Use `gh api .../comments` for INLINE review comments (file:line
      anchored). Do NOT use `gh pr view --comments` here -- that returns
      issue-tab comments, not review threads.

      Each inline comment in the API response carries its own
      `commit_id` -- that is the fixup target for that specific
      comment. Preserve it in the output. Also preserve `path`,
      `line` (or `original_line`), `body`, and `user.login`.

      Output the raw results as-is. Do not analyze, do not summarize,
      do not filter. The downstream steps need the full data.

  fix:
    role: developer
    input: [fetch]
    print_output: true
    task: |
      ## Critical scope (read first, re-read at the end)

      Apply the review feedback from PR #{{id}} as fixup commits. Do
      not commit on main -- always check out the PR branch first.

      ## Step 1: check out the PR branch (mandatory)

      Run `gh pr checkout {{id}}` before doing anything else.

      If checkout fails (dirty worktree, conflicts, missing remote,
      etc.): STOP. Report the failure verbatim and exit. Do NOT
      stash, do NOT force, do NOT continue on whatever branch you
      happen to be on. A silent stash hides work and risks data loss.

      ## Step 2: handle the no-comments case

      If the inline-comments API response from fetch is an empty
      array, or contains zero unresolved comments addressed to the
      author, output exactly this single line and stop:

          NO_REVIEW_COMMENTS

      Do not create any commits. Do not push. The verify step maps
      this sentinel to FINAL_VERDICT: DONE.

      ## Step 3: classify every comment

      For each inline comment from fetch, classify it:

      - Blocking: bug, regression, missing error handling on a
        production path, factually wrong code, broken test.
      - Suggestion: better-but-not-required design or naming choice,
        a different pattern, a "could also do X".
      - Nit: pure formatting, comment wording, ordering.

      Address ALL Blocking comments. DEFER Suggestions and Nits with
      a one-sentence reason for each. Do not silently ignore them.

      ## Step 4: fix Blocking comments

      For each Blocking comment, in order:

      1. Read the cited file at the cited line, plus 10 lines of
         surrounding context. Never fix blind from the comment text
         alone -- the line may already differ from when the comment
         was written.
      2. Make the smallest change that resolves the concern. No
         feature creep. No "while I'm here" refactors.
      3. Stage only the files you changed.
      4. Create a fixup commit targeting the original commit:
         `git commit --fixup=<comment.commit_id>`
         The `commit_id` comes from the inline-comments API
         response, not from the PR head.

      ## Required output format

      For each comment processed, output:

      ### Comment by @<user> on <path>:<line>
      - Severity: Blocking | Suggestion | Nit
      - Action: Fixed | Deferred | Skipped (nit)
      - Fixup SHA: <short-sha or "n/a">
      - Reasoning: [one sentence -- why this fix, or why deferred]

      End with:

      ### Summary
      - Blocking addressed: N / M
      - Deferred suggestions: N
      - Skipped nits: N
      - New fixup commits: N

      ## Anti-pattern (do not produce this)

      BAD: "Applied all review feedback. All fixups created."
      Why bad: No per-comment classification, no fixup SHAs, no
      deferral reasoning. The verify step cannot check correctness
      from this.

      GOOD: "Comment by @charemma on src/runner.rs:88. Severity:
      Blocking. Action: Fixed. Fixup SHA: a1b2c3d. Reasoning:
      replaced unwrap with `?` so the missing-config path returns
      ConfigError instead of panicking."

      ## Final check (anti-sycophancy)

      Before submitting: are all your fixes actual code changes that
      a reviewer would accept, or did you reword the comment as a
      code comment and call it fixed? If any "fix" is just a
      comment, redo it.

      REMINDER: never commit on main. If you are on main when you
      are about to commit, stop and report.

  verify:
    role: reviewer
    input: [fetch, fix]
    print_output: true
    task: |
      ## Critical scope (read first, re-read at the end)

      Verify that the fixup commits from the fix step ACTUALLY
      resolve the Blocking review comments from fetch. Read the
      diff. Do not trust the fix step's self-report.

      Use the output format defined in this task. The downstream
      push step depends on finding `FINAL_VERDICT: DONE` or
      `FINAL_VERDICT: INCOMPLETE` exactly as specified below. This
      exact prefix appears once in your output (Summary section
      only).

      ## No-comments early exit

      If fix output is exactly the line `NO_REVIEW_COMMENTS`, output:

          ### Summary
          - Blocking comments: 0
          - FINAL_VERDICT: DONE

      and stop. Nothing else to verify.

      ## How to verify

      1. List the fixup commits ahead of the base branch:
         `git log --oneline origin/$(gh pr view {{id}} --json baseRefName -q .baseRefName)..HEAD`
         Confirm they all start with `fixup!`.
      2. For each Blocking comment from fetch:
         a. Locate the corresponding fixup (by `commit_id` or by
            file:line in the diff).
         b. Read the diff: `git show <fixup-sha>`.
         c. Read the cited file at the cited line POST-fixup.
         d. Decide: does the change resolve the concern raised in
            the comment, or only paper over it?

      Clean code that does NOT resolve the comment is INCOMPLETE.
      A messy fix that does resolve it is DONE.

      ## Required output format

      For each Blocking comment, output exactly:

      ### Comment by @<user> on <path>:<line>
      - Concern: [what the reviewer asked for]
      - Fixup: <short-sha or "missing">
      - Diff check: [what the fixup actually changed]
      - Resolves concern: yes | no -- [one sentence]

      End with:

      ### Summary
      - Blocking comments: N
      - Resolved: N
      - Unresolved: [list of file:line or "none"]
      - FINAL_VERDICT: DONE | INCOMPLETE

      The `FINAL_VERDICT:` line must appear exactly once and on its
      own line. Do not repeat the literal token elsewhere in your
      response.

      ## Severity rules for the verdict

      - DONE: every Blocking comment has a fixup that materially
        resolves it. Deferred Suggestions/Nits do not block DONE.
      - INCOMPLETE: at least one Blocking comment lacks a fixup, or
        has a fixup that does not actually resolve the concern.

      ## Few-shot examples

      GOOD: "Comment by @charemma on src/runner.rs:88. Concern:
      unwrap() will panic on missing config. Fixup: a1b2c3d. Diff
      check: replaced `unwrap()` with `?` and added ConfigError
      variant. Resolves concern: yes -- the panic path is gone."

      GOOD: "Comment by @charemma on src/dag.rs:124. Concern: cycle
      detection broken. Fixup: missing. Diff check: no fixup found
      for this commit_id. Resolves concern: no -- the bug is still
      present."

      ## Anti-patterns (do not do this)

      BAD: "All fixups created. DONE."
      Why bad: No per-comment check, no diff inspection.

      BAD: "Looks like the issues were addressed. PASS."
      Why bad: Wrong verdict token, no evidence.

      ## Final check

      If every Blocking comment shows "Resolves concern: yes" but
      you did not actually open `git show` for any of them, redo
      the verification. The verdict has to be evidence-based.

      REMINDER: clean code that does the wrong thing is INCOMPLETE.

  push:
    role: developer
    input: [verify]
    print_output: true
    task: |
      Check the verify step's verdict. Look for the line
      `FINAL_VERDICT: DONE` or `FINAL_VERDICT: INCOMPLETE` (this
      prefix appears once in the verify output, in the Summary).

      ## Branch DONE: push the fixup commits

      Required pre-push gate: at least one `fixup!` commit must be
      ahead of `origin/$branch`. Run:

          git log --oneline origin/$(gh pr view {{id}} --json headRefName -q .headRefName)..HEAD

      Count the lines whose subject starts with `fixup!`. If zero,
      do NOT push. Output:

          Nothing to push -- no fixup commits ahead of origin.

      and stop. (This is the no-comments early-exit case.)

      If at least one fixup commit is present, push atomically:

          branch=$(gh pr view {{id}} --json headRefName -q .headRefName) && git push origin "$branch"

      Run that as a single shell statement -- branch resolution and
      push must be one command so a transient `gh` failure cannot
      leave you pushing to the wrong branch. After push, output:

      - PR URL
      - Number of fixup commits pushed
      - Reminder: run `git rebase --autosquash <baseRef>` after
        final review approval.

      ## Branch INCOMPLETE: do NOT push

      - Output the unresolved Blocking concerns from verify
        verbatim.
      - Output the local fixup SHAs (so the developer can inspect
        with `git show`).
      - Output: "Push skipped -- verdict INCOMPLETE. Resolve the
        items above and rerun rework-pr."
      - Stop. Do not force, do not push partial work.

      ## Branch unclear: neither token found

      If neither `FINAL_VERDICT: DONE` nor `FINAL_VERDICT:
      INCOMPLETE` appears in the verify output:

      - Do NOT push.
      - Output: "Verify verdict unclear. Expected
        'FINAL_VERDICT: DONE' or 'FINAL_VERDICT: INCOMPLETE' in
        verify output."
      - Stop.

      ## Final check (anti-sycophancy)

      Before pushing: did verify cite a specific fixup SHA AND a
      diff check for every Blocking comment marked resolved? If
      verify reported DONE without per-comment evidence, treat that
      as an unclear verdict and refuse to push.

      REMINDER: never push when the verdict is INCOMPLETE or
      unclear. The fixup commits stay on the local branch -- the
      developer fixes them and reruns.
