name: Feature
description: Propose a new feature or enhancement.
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be built and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is IN and OUT of scope for this change?
      value: |
        IN:
        -

        OUT:
        -
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Testable conditions that define "done". Each must be verifiable.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other issues or PRs this depends on.
    validations:
      required: false
