# CI runs every job inside the project's flake devShell so the toolchain in
# CI is the exact one pinned by flake.lock and used locally via `nix develop`.
#
# Do NOT replace this with `dtolnay/rust-toolchain` + `Swatinem/rust-cache` +
# `extractions/setup-just`. That setup pulls a floating "stable" at workflow-run
# time and bypasses flake.lock, which breaks local==CI parity. See
# docs/decisions/0008-ci-uses-flake-devshell.md and issue #303 for the
# rationale before changing this.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix develop --command just lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix develop --command just build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix develop --command just test

  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix develop --command just check-version
